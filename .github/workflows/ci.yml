name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new advisories against pinned dependencies surface without a code change.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shuttle-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shuttle-app/src-tauri

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config python3 \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libdbus-1-dev libssl-dev libayatana-appindicator3-dev libxdo-dev

      - name: Python connector tests
        run: python3 -m unittest discover -s connectors/tests

      - name: Rust tests
        working-directory: shuttle-app/src-tauri
        run: cargo test

      - name: Frontend install
        working-directory: shuttle-app
        run: npm ci

      - name: Frontend type check
        working-directory: shuttle-app
        run: npx svelte-check

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rust advisories, licenses and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: shuttle-app/src-tauri/Cargo.toml
          command: check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: npm audit (runtime dependencies)
        working-directory: shuttle-app
        run: npm audit --omit=dev
