name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.2.1)
        required: true
      run_id:
        description: Workflow run ID with build artifacts
        required: true
  push:
    branches: [main]
    paths:
      - .github/release-republish.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: inputs
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "run_id=${{ github.event.inputs.run_id }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(jq -r '.tag' .github/release-republish.json)
            RUN_ID=$(jq -r '.run_id' .github/release-republish.json)
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.inputs.outputs.tag }}"
          VERSION="${VERSION#v}"
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) { exit }
              if ($0 ~ "^## \\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [[ -z "$NOTES" ]]; then
            echo "No changelog section for $VERSION" >&2
            exit 1
          fi
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ steps.inputs.outputs.run_id }}
          path: dist

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -type f \( \
            -path '*/bundle/deb/*.deb' \
            -o -path '*/bundle/dmg/*.dmg' \
            -o -path '*/bundle/msi/*.msi' \
          \) -size +1024c -print -exec cp {} release-assets/ \;
          cp CHANGELOG.md release-assets/
          echo "Release assets:"
          ls -lh release-assets/

      - name: Delete existing release (if republishing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ steps.inputs.outputs.tag }}" --repo "${{ github.repository }}" -y || true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.inputs.outputs.tag }}
          name: Shuttle ${{ steps.inputs.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          files: release-assets/*
          replace_assets: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
