name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.2.1)
        required: true
      run_id:
        description: Workflow run ID with build artifacts
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) { exit }
              if ($0 ~ "^## \\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [[ -z "$NOTES" ]]; then
            echo "No changelog section for $VERSION" >&2
            exit 1
          fi
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.inputs.run_id }}
          path: dist

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -type f \( \
            -path '*/bundle/deb/*.deb' \
            -o -path '*/bundle/rpm/*.rpm' \
            -o -path '*/bundle/appimage/*.AppImage' \
            -o -path '*/bundle/dmg/*.dmg' \
            -o -path '*/bundle/msi/*.msi' \
            -o -path '*/bundle/nsis/*.exe' \
          \) -size +1024c -print -exec cp {} release-assets/ \;
          cp CHANGELOG.md release-assets/
          echo "Release assets:"
          ls -lh release-assets/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Shuttle ${{ github.event.inputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          files: release-assets/*
          replace_assets: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
