name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to use for telemetry secrets
        required: true
        default: testing
        type: choice
        options:
          - production
          - testing

permissions:
  contents: write

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
      channel: ${{ steps.pick.outputs.channel }}
    steps:
      - id: pick
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == refs/heads/main || "${{ github.ref }}" == refs/tags/v* ]]; then
            ENV="production"
          else
            ENV="testing"
          fi
          echo "name=$ENV" >> "$GITHUB_OUTPUT"
          echo "channel=$ENV" >> "$GITHUB_OUTPUT"

  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
      has_jobs: ${{ steps.filter.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        shell: bash
        run: |
          FULL='[
            {"os":"ubuntu-latest","platform":"linux-amd64","rust_target":"x86_64-unknown-linux-gnu"},
            {"os":"ubuntu-24.04-arm","platform":"linux-arm64","rust_target":"aarch64-unknown-linux-gnu"},
            {"os":"macos-latest","platform":"macos-universal","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin","tauri_target":"universal-apple-darwin"},
            {"os":"windows-latest","platform":"windows-amd64","rust_target":"x86_64-pc-windows-msvc"},
            {"os":"windows-11-arm","platform":"windows-arm64","rust_target":"aarch64-pc-windows-msvc"}
          ]'

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Tag release: building full matrix"
            echo "matrix=$(echo "$FULL" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WANT=$(grep -v '^\s*#' .github/ci-rebuild-platforms.txt | grep -v '^\s*$' | tr '\n' ' ')
          if [[ "$WANT" == *"none"* ]]; then
            echo "Rebuild skipped (ci-rebuild-platforms.txt is 'none')"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$WANT" || "$WANT" == *"all"* ]]; then
            FILTERED="$FULL"
          else
            FILTERED=$(echo "$FULL" | jq --arg want "$WANT" '[.[] | select(.platform as $p | ($want | split(" ") | map(select(length > 0))) | index($p))]')
          fi

          COUNT=$(echo "$FILTERED" | jq 'length')
          if [[ "$COUNT" -eq 0 ]]; then
            echo "No platforms matched; defaulting to full matrix"
            FILTERED="$FULL"
          fi

          echo "Selected platforms:"
          echo "$FILTERED" | jq -r '.[].platform'
          echo "matrix=$(echo "$FILTERED" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "has_jobs=true" >> "$GITHUB_OUTPUT"

  build:
    needs: [resolve-environment, prepare-matrix]
    if: needs.prepare-matrix.outputs.has_jobs == 'true'
    environment: ${{ needs.resolve-environment.outputs.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shuttle-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || matrix.rust_target }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config python3 \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libdbus-1-dev libssl-dev libayatana-appindicator3-dev libxdo-dev \
            xdg-utils libfuse2

      - name: Install frontend
        working-directory: shuttle-app
        run: npm ci

      - name: Build bundles
        working-directory: shuttle-app
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          SHUTTLE_BUILD_CHANNEL: ${{ needs.resolve-environment.outputs.channel }}
          SHUTTLE_GIT_COMMIT: ${{ github.sha }}
          SHUTTLE_COMPONENTS_BASE_URL: ${{ secrets.SHUTTLE_COMPONENTS_BASE_URL }}
          VITE_GIPHY_API_KEY: ${{ secrets.VITE_GIPHY_API_KEY }}
        run: |
          if [[ -n "${{ matrix.tauri_target }}" ]]; then
            npm run tauri build -- --target "${{ matrix.tauri_target }}"
          elif [[ "${{ matrix.rust_target }}" != "x86_64-unknown-linux-gnu" && "${{ runner.os }}" != "Windows" ]]; then
            npm run tauri build -- --target "${{ matrix.rust_target }}"
          elif [[ "${{ runner.os }}" == "Windows" && "${{ matrix.rust_target }}" != "x86_64-pc-windows-msvc" ]]; then
            npm run tauri build -- --target "${{ matrix.rust_target }}"
          else
            npm run tauri build
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-${{ matrix.platform }}
          path: |
            shuttle-app/src-tauri/target/release/bundle/**/*
            shuttle-app/src-tauri/target/${{ matrix.tauri_target || matrix.rust_target }}/release/bundle/**/*
            !**/*.d

  publish:
    needs: [resolve-environment, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) { exit }
              if ($0 ~ "^## \\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)
          if [[ -z "$NOTES" ]]; then
            echo "No changelog section for $VERSION" >&2
            exit 1
          fi
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          # One primary installer per CI platform (5), plus CHANGELOG.
          find dist -type f \( \
            -path '*/bundle/deb/*.deb' \
            -o -path '*/bundle/dmg/*.dmg' \
            -o -path '*/bundle/msi/*.msi' \
          \) -size +1024c -print -exec cp {} release-assets/ \;
          cp CHANGELOG.md release-assets/
          echo "Release assets:"
          ls -lh release-assets/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Shuttle ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: release-assets/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
