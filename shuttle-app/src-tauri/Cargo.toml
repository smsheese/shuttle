[package]
name = "shuttle"
version = "0.6.4"
description = "Local-first unified messaging desktop app"
authors = ["Sheese Sheikh <https://shee.se>"]
homepage = "https://shee.se"
repository = "https://github.com/smsheese/shuttle"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "shuttle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "~2.11.5", features = ["image-png", "tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "~2.7.2"
tauri-plugin-opener = "~2.5.4"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "process", "io-util", "fs"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify-rust = "4"
age = "0.12.1"
tar = "0.4.46"
tempfile = "3.27.0"
regex = "1"
# Release tag comparison for the About page update check. Already in the tree via tauri.
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
base64 = "0.22"
zip = "9"
flate2 = "1"
futures-util = "0.3"
dotenvy = "0.15"
libc = "0.2"
# Native clipboard for "Copy media": images + file lists (X11, Wayland, Windows, macOS). See docs/platforms.md.
clipboard-rs = { version = "0.3", features = ["wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
posthog-rs = { version = "0.31", default-features = false, features = ["error-tracking"] }
# Cross-platform process CPU and memory for the opt-in performance snapshots (MIT).
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
# Both are already in the tree through wry; naming them lets permissions.rs answer WebView2's
# microphone prompt, which wry leaves to the host app.
webview2-com = "0.38"
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
# Same crate and version wry links. `v2_8` carries the audio/video flags on the media request.
webkit2gtk = { version = "=2.0.2", features = ["v2_8"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The live WebKitGTK check in permissions.rs needs a GtkWindow; wry already builds this crate.
gtk = "0.18"

[dev-dependencies]
tempfile = "3.27.0"

