[package]
name = "shuttle"
version = "0.3.2"
description = "Local-first unified messaging desktop app"
authors = ["Sheese Sheikh <https://shee.se>"]
homepage = "https://shee.se"
repository = "https://github.com/smsheese/shuttle"
license = "AGPL-3.0"
edition = "2021"

[lib]
name = "shuttle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "process", "io-util", "fs"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
dirs = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify-rust = "4"
age = "0.12.1"
tar = "0.4.46"
tempfile = "3.27.0"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
base64 = "0.22"
zip = "2"
flate2 = "1"
futures-util = "0.3"
sentry = { version = "0.35", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
dotenvy = "0.15"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"

