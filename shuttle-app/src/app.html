<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/shuttle-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shuttle</title>
    <style>
      /* Static boot screen, painted before any app CSS or JS runs and removed on mount. */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f4f4f5;
        color: #18181b;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      #boot-splash img {
        width: 88px;
        height: 88px;
        object-fit: contain;
      }
      #boot-splash .boot-title {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      #boot-splash .boot-tagline {
        max-width: 280px;
        margin: 0;
        text-align: center;
        font-size: 13px;
        line-height: 1.5;
        color: #52525b;
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          background: #09090b;
          color: #f4f4f5;
        }
        #boot-splash .boot-tagline {
          color: #a1a1aa;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div class="app-shell">%sveltekit.body%</div>
    <div id="boot-splash" aria-hidden="true">
      <img src="%sveltekit.assets%/shuttle-logo.png" width="88" height="88" alt="" />
      <div class="boot-title">Shuttle</div>
      <p class="boot-tagline">Local-first unified messaging for your desktop.</p>
    </div>
  </body>
</html>
