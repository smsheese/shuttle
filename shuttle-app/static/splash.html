<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shuttle</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      }
      .splash {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 35%, #15151a 0%, #09090b 68%);
        color: #f4f4f5;
        border-radius: 16px;
        border: 1px solid #27272f;
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      }
      .logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      .title {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .tagline {
        max-width: 280px;
        text-align: center;
        font-size: 13px;
        line-height: 1.5;
        color: #a1a1aa;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid rgba(255, 191, 63, 0.25);
        border-top-color: #ffbf3f;
        animation: spin 0.9s linear infinite;
        margin-top: 8px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img class="logo" src="shuttle-logo.png" width="96" height="96" alt="Shuttle logo" />
      <div class="title">Shuttle</div>
      <p class="tagline">Local-first unified messaging for your desktop.</p>
      <div class="spinner" aria-hidden="true"></div>
    </div>
  </body>
</html>
